name: Setup D1 Database (Run Once)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Create D1 database and capture ID
        id: create_db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          OUTPUT=$(npx wrangler d1 create solarroots-directory 2>&1)
          echo "$OUTPUT"
          DB_ID=$(echo "$OUTPUT" | grep 'database_id' | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not extract database_id from wrangler output."
            exit 1
          fi
          echo "db_id=$DB_ID" >> $GITHUB_OUTPUT

      - name: Update wrangler.toml with database ID
        run: |
          sed -i 's/database_id = "REPLACE_WITH_D1_DATABASE_ID"/database_id = "${{ steps.create_db.outputs.db_id }}"/' wrangler.toml
          grep 'database_id' wrangler.toml

      - name: Apply migrations to remote D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply solarroots-directory --remote

      - name: Commit updated wrangler.toml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git commit -m "chore: configure D1 database_id in wrangler.toml"
          git push
