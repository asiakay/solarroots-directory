name: Setup D1 Database (Run Once)

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Resolve D1 database ID (create if needed)
        id: create_db
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Check if the database already exists
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null \
            | python3 -c "
          import sys, json
          try:
              dbs = json.load(sys.stdin)
              for db in dbs:
                  if db.get('name') == 'solarroots-directory':
                      print(db.get('uuid', ''))
                      break
          except Exception:
              pass
          " 2>/dev/null)

          if [ -n "$DB_ID" ]; then
            echo "Database already exists with id: $DB_ID"
          else
            echo "Creating new D1 database..."
            OUTPUT=$(npx wrangler d1 create solarroots-directory 2>&1)
            echo "$OUTPUT"
            # Extract UUID from output (matches any UUID pattern)
            DB_ID=$(echo "$OUTPUT" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          fi

          if [ -z "$DB_ID" ]; then
            echo "ERROR: Could not determine database_id."
            exit 1
          fi

          echo "Using database_id: $DB_ID"
          echo "db_id=$DB_ID" >> $GITHUB_OUTPUT

      - name: Update wrangler.toml with database ID
        run: |
          sed -i "s/database_id = \"REPLACE_WITH_D1_DATABASE_ID\"/database_id = \"${{ steps.create_db.outputs.db_id }}\"/" wrangler.toml
          echo "=== wrangler.toml after update ==="
          cat wrangler.toml
          # Fail fast if placeholder is still present
          if grep -q 'REPLACE_WITH_D1_DATABASE_ID' wrangler.toml; then
            echo "ERROR: sed replacement failed — placeholder still present."
            exit 1
          fi

      - name: Apply migrations to remote D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote

      - name: Commit updated wrangler.toml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrangler.toml
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: configure D1 database_id in wrangler.toml"
          git push
